<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Vaňha</title>

    <style>
        body {
            background-color: rgb(0, 75, 6);
            font-size: 16px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .ramecek {
            width: 800px;
            border: 4px solid rgb(0, 0, 0);
            border-radius: 15px;
            background-color: white;
            padding: 10px;
            margin: 0;
            position: relative;
            text-align: left;
        }
        .jmeno {
            font-size: 20px;
            font-weight: bold;
            margin-top: 0;
        }
        button {
            background-color: rgb(60, 0, 75);
            color: white;
            border: 2px solid black;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="ramecek">
        <img src="https://www.sokol-hostoun.cz/files/imagecache/functionary_thumb/7_vanha_daniel_hostoun_U17_20251001boh.JPG" alt="Profilová fotka" width="150">

        <h1 class="jmeno">Daniel Vaňha</h1>

        <p>Mám zkušenosti s HTML, CSS a JavaScriptem a rád vytvářím moderní a responzivní webové stránky.</p>

        <h2>Mé 3 oblíbené věci</h2>

        <ul>
            <li>Fotbal</li>
            <li>Hraní videoher</li>
            <li>Pho s kuřecím</li>
        </ul>

        <button onclick="alert('Tlačítko funguje')">
            Zmáčkni mě
        </button>
    </div>
</body>

</html>
